name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-test:
    name: Rust Backend Tests & Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Rust Format Check
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check
        continue-on-error: true

      - name: Run Backend Unit & Integration Tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml -- --nocapture

  frontend-test:
    name: React Frontend Build & Typecheck
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci || npm install

      - name: Frontend Typecheck & Production Build
        working-directory: app/frontend
        run: npm run build
