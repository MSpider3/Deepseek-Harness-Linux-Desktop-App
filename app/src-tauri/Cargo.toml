[package]
name = "deepseek-harness-linux"
version = "0.1.0"
description = "DeepSeek Harness Linux Native Desktop Application"
authors = ["Antigravity Engineering"]
edition = "2021"
default-run = "deepseek-harness-linux"

[lib]
name = "deepseek_harness_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-notification = "2.2.1"
tauri-plugin-process = "2.2.0"
tauri-plugin-single-instance = "2.2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1.0"
regex = "1.11"
semver = "1.0"
similar = { version = "2.7", features = ["inline"] }

aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
libc = "0.2"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "6.0"

[dev-dependencies]
tempfile = "3.17"
